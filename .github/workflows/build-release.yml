name: Build and release

# Runs only when a new tag like v1.2.0 is pushed. It runs the tests, builds every platform,
# publishes a GitHub release with every file, then renames the repository back to PackObfuscator.
# Nothing runs on ordinary pushes or pull requests.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Each tag builds separately and is never cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Run tests
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon --console=plain

      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test-results/test/
          retention-days: 7

  # The command-line-only zip. Java-only, so it is built once, not per OS.
  cli:
    name: CLI zip
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Work out the version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build CLI zip
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew cliZip -PappVersion=${{ steps.version.outputs.version }} --no-daemon --console=plain

      - name: Upload CLI zip
        uses: actions/upload-artifact@v4
        with:
          name: cli-zip
          path: build/dist/*-cli.zip
          if-no-files-found: error
          retention-days: 30

  package:
    name: Package (${{ matrix.platform }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Work out the version
        id: version
        shell: bash
        run: |
          # Tags must look like v1.2.3. Anything else gets a dev version 1.0.<run number>.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME#v}"
            if [[ ! "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag '$GITHUB_REF_NAME' must look like v1.2.3"
              exit 1
            fi
            version="$tag"
          else
            version="1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version $version"

      - name: Build portable archive
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew portableZip -PappVersion=${{ steps.version.outputs.version }} --no-daemon --console=plain

      # The installer needs tools that differ per OS (WiX on Windows, hdiutil on macOS, dpkg on Linux).
      # If it fails, the portable build still ships and the job stays green with a warning.
      - name: Build native installer
        id: installer
        shell: bash
        continue-on-error: true
        run: |
          ./gradlew jpackageInstaller -PappVersion=${{ steps.version.outputs.version }} --no-daemon --console=plain

      - name: Warn if the installer was skipped
        if: steps.installer.outcome == 'failure'
        shell: bash
        run: echo "::warning::Native installer failed on ${{ matrix.platform }}. The portable archive is still published."

      # jpackage builds the .rpm with rpmbuild, which is not installed on Ubuntu runners by default.
      - name: Install RPM tools (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build RPM (Linux)
        if: runner.os == 'Linux'
        id: rpm
        shell: bash
        continue-on-error: true
        run: |
          ./gradlew jpackageRpm -PappVersion=${{ steps.version.outputs.version }} --no-daemon --console=plain

      - name: Warn if the RPM was skipped
        if: runner.os == 'Linux' && steps.rpm.outcome == 'failure'
        shell: bash
        run: echo "::warning::RPM build failed. The .deb and portable archive are still published."

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: PackObfuscator-${{ matrix.platform }}
          path: build/dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish releases
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # gh release create --generate-notes reads the git history, so the repo must be checked out.
      - uses: actions/checkout@v4

      - name: Download every platform build
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: PackObfuscator-*
          merge-multiple: true

      - name: Download the CLI zip
        uses: actions/download-artifact@v4
        with:
          name: cli-zip
          path: cli

      - name: Create checksums
        shell: bash
        run: |
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          (cd cli && sha256sum * > SHA256SUMS-cli.txt && cat SHA256SUMS-cli.txt)

      # Release 1: the desktop app (portable archives, installers, RPM) and the CLI bundled inside the portable archives.
      - name: Publish desktop release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Pack Obfuscator $GITHUB_REF_NAME" \
            --generate-notes \
            --latest

      # Release 2: the command-line-only zip. It is pinned to the tagged commit and is not marked latest,
      # so the desktop update check keeps reading release 1.
      - name: Publish CLI release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}-cli" cli/* \
            --target "$GITHUB_SHA" \
            --title "Pack Obfuscator CLI $GITHUB_REF_NAME" \
            --notes "Command-line only. Needs Java 21 or newer. The desktop app is in release $GITHUB_REF_NAME." \
            --latest=false

      # Renaming needs a token with repository administration rights. The default GITHUB_TOKEN cannot
      # rename a repository, so add a fine-grained token as the REPO_RENAME_TOKEN secret.
      - name: Rename the repository back to PackObfuscator
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.REPO_RENAME_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::REPO_RENAME_TOKEN is not set, so the repository was not renamed."
            exit 0
          fi
          owner="${REPO%%/*}"
          current="${REPO#*/}"
          if [ "$current" = "PackObfuscator" ]; then
            echo "Repository is already named PackObfuscator."
            exit 0
          fi
          gh api -X PATCH "repos/$REPO" -f name=PackObfuscator
          echo "Renamed $REPO to $owner/PackObfuscator."
